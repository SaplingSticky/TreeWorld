name: Build Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach artifacts to (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: treeworld/package-lock.json

      - name: Install dependencies
        working-directory: treeworld
        run: npm ci

      - name: Lint & test
        working-directory: treeworld
        run: npm run lint && npm test

      - name: Build frontend
        working-directory: treeworld
        run: npm run build

      - name: Build Tauri Windows installer (NSIS)
        working-directory: treeworld
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeWorld-windows-installer
          path: treeworld/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: treeworld/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
