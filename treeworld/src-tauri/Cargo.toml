[package]
name = "treeworld"
version = "1.1.0"
description = "AI-powered infinite canvas — a shared creative space for humans and AI"
authors = ["CrazyLoveStudio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
